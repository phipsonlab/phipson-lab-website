# site properties and page defaults
title: Phipson Lab
subtitle:
description: The Phipson laboratory develops novel bioinformatics methods and conducts collaborative analysis projects to reveal insights into normal development and disease using sophisticated statistical modeling and single-cell technologies.
header: images/background.jpg
footer: images/background.jpg
proofer: false

# site social media and other links
links:
  email: phipson.b@wehi.edu.au
  orcid: 0000-0002-1711-7454
  google-scholar: od4hT8gAAAAJ&hl=en
  github: phipsonlab
  twitter: BelindaPhipson
#  youtube: BelindaPhipson

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
