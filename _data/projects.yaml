- title: SuperCellCyto
  subtitle: SuperCell for Cytometry data
  group: featured
  image: images/photo.jpg
  link: https://github.com/phipsonlab/SuperCellCyto
  description: An extension of the SuperCell R package tailored for cytometry data. Aggregates cells with similar marker expressions into "supercells" for each individual sample, enabling efficient analysis of large-scale cytometry datasets.
